# ------- Monitors -----------

monitorrule=name:eDP-1,scale:1.5

# ------- ENV -----------

env=QT_QPA_PLATFORMTHEME,qt6ct


# ------- Startup Exec -----------

exec-once = noctalia
exec-once = /usr/lib/xdg-desktop-portal
exec-once = /usr/lib/xdg-desktop-portal-gtk 
exec-once = /usr/lib/xdg-desktop-portal-wlr 
exec-once = kdeconnectd
exec-once = wl-clip-persist --clipboard regular

# ------- Misc -----------

drag_tile_to_tile=1
no_border_when_single=0
allow_tearing=2

# ------- Animations -----------

animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=zoom
layer_animation_type_close=fade
tag_animation_direction=0
animation_duration_move=300
animation_duration_tag=150

#-------- Appearence --------------

borderpx=2
border_radius=0
no_border_when_single=1

cursor_size=24
cursor_theme=breeze_cursors

gappih=5
gappiv=5
gappoh=10
gappov=10

blur=1
blur_optimized=1

shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

#--------Layout--------------
# === Master ===

default_mfact=0.5
smartgaps=1

# === Scroller ===

scroller_default_proportion=0.75
scroller_ignore_proportion_single=0
scroller_focus_center=1


#-------- Rules--------------

# === TagRules ===
tagrule=id:1,layout_name:scroller,no_hide:1
tagrule=id:2,layout_name:master,no_hide:1
tagrule=id:3,layout_name:tgmix,no_hide:1

# === WindowRules ===
windowrule=force_tearing:1,appid:steam_app_default
windowrule=force_tearing:1,appid:Alabaster Dawn


#--------INPUT--------------

trackpad_natural_scrolling=1
tap_to_click=1
drag_lock=0
middle_button_emulation=1
tap_and_drag=1

# -------KEYBINDS-----------

bind=super+shift,r,reload_config
bind=super+shift,x,quit

# === Layouts ===

bind=SUPER,s,setlayout,scroller
bind=SUPER,t,setlayout,tile
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

# === Scratchpad ===

bind=SUPER,i,minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER+SHIFT,i,restore_minimized


# === Switch to tag ===

bind=super,1,view,1
bind=super,2,view,2
bind=super,3,view,3
bind=super,4,view,4
bind=super,5,view,5
bind=super,6,view,6
bind=super,7,view,7
bind=super,8,view,8
bind=super,9,view,9

# === Move windows ===

bind=super+shift,1,tag,1
bind=super+shift,2,tag,2
bind=super+shift,3,tag,3
bind=super+shift,4,tag,4
bind=super+shift,5,tag,5
bind=super+shift,6,tag,6
bind=super+shift,7,tag,7
bind=super+shift,8,tag,8
bind=super+shift,9,tag,9

# === Noctalia v4 ===
#bind=super,r,spawn,qs -c noctalia-shell ipc call launcher toggle
#bind=super,semicolon,spawn,qs -c noctalia-shell ipc call settings toggle
#bind=super,l,spawn,qs -c noctalia-shell ipc call sessionMenu toggle
#bind=super+shift,w,spawn,qs -c noctalia-shell ipc call wallpaper toggle
#bind=super,a,spawn,qs -c noctalia-shell ipc call wallpaper random

# === Noctalia v5 ===
bind=super,r,spawn,noctalia msg panel-toggle launcher
bind=super,semicolon,spawn,noctalia msg panel-toggle control-center
bind=super,l,spawn,noctalia msg panel-toggle session
bind=super+shift,w,spawn,noctalia msg panel-toggle wallpaper
bind=super,a,spawn,noctalia msg wallpaper-random
bind=super+shift,s,spawn,noctalia msg screenshot-region pick

# === Applications ===

bind=super,w,spawn,brave-origin
bind=super,e,spawn,thunar
bind=super,return,spawn,kitty --single-instance

# === Window Management ===
bind=super,q,killclient
bind=super,f,togglefullscreen
bind=super+shift,f,togglefakefullscreen
bind=super,p,togglefloating
bind=super+shift,p,toggle_all_floating

bind=super,left,focusdir,left
bind=super,right,focusdir,right
bind=super,up,focusdir,up
bind=super,down,focusdir,down

bind=super+shift,Up,resizewin,+0,-50
bind=super+shift,Down,resizewin,+0,+50
bind=super+shift,Left,resizewin,-50,+0
bind=super+shift,Right,resizewin,+50,+0

# === Brightness ===
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
# === Volume ===
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER+shift,btn_left,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# === Gesture ===
gesturebind=none,up,3,viewtoright
gesturebind=none,down,3,viewtoleft
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right

# === Lid Events ===
switchbind=fold,spawn_shell,noctalia msg session lock-and-suspend

# This sources the noctalia theme

source = /home/pranjal/.config/mango/noctalia.conf


source=/home/pranjal/.config/mango/noctalia.conf
